<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Portfolio</title>
  <link rel="shortcut icon" href="https://via.placeholder.com/32x32/333333/ffffff?text=F" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <main>
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="navbar-container"></div>
      <article class="portfolio active" data-page="portfolio">

        <header>
          <h2 class="h2 article-title">Portfolio</h2>
        </header>

        <section class="portfolio-content">
          <div class="portfolio-intro">
            <p>
              Welcome to my portfolio! Here you can view my live resume directly synced with Overleaf, preview the document, or download a local copy.
            </p>
          </div>

          <div class="resume-viewer">
            <div class="viewer-controls">
              <div class="viewer-info">
                <div class="viewer-title-row">
                  <h4>Curriculum Vitae</h4>
                  <span class="live-status-pill">
                    <span class="live-pulse-dot"></span>
                    Live Sync (Overleaf)
                  </span>
                </div>
                <p>Real-time compiled version always up to date</p>
              </div>
              <div class="download-controls">
                <a href="https://www.overleaf.com/read/bgwjthpmcpts#4ef6c7" target="_blank" rel="noopener noreferrer" class="live-overleaf-btn" title="View Real-Time Live Feed on Overleaf">
                  <ion-icon name="open-outline"></ion-icon>
                  <span>Open Live on Overleaf</span>
                </a>
                <a href="Resume.pdf?v=2" download class="download-btn" title="Download Offline Copy">
                  <ion-icon name="download-outline"></ion-icon>
                  <span>Download PDF</span>
                </a>
              </div>
            </div>

            <div class="resume-container">
              <iframe src="Resume.pdf?v=2" class="document-preview" title="Resume Preview">
                <div class="preview-fallback">
                  <div class="preview-placeholder">
                    <ion-icon name="document-outline"></ion-icon>
                    <h3>Resume Preview</h3>
                    <p>Your browser doesn't support direct PDF embedding.</p>
                    <div class="preview-actions">
                      <a href="https://www.overleaf.com/read/bgwjthpmcpts#4ef6c7" target="_blank" rel="noopener noreferrer" class="live-overleaf-btn">
                        <ion-icon name="open-outline"></ion-icon>
                        <span>Open Live on Overleaf</span>
                      </a>
                      <a href="Resume.pdf?v=2" target="_blank" class="preview-btn">
                        <ion-icon name="open-outline"></ion-icon>
                        <span>Open PDF in New Tab</span>
                      </a>
                    </div>
                  </div>
                </div>
              </iframe>
            </div>

          </div>
        </section>

      </article>
    </div>
  </main>
  <script src="script.js?v=2"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
